services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: prospex
      POSTGRES_PASSWORD: prospex
      POSTGRES_DB: prospex
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prospex"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    command: node apps/api/dist/server.js
    env_file: .env
    environment:
      DATABASE_URL: postgres://prospex:prospex@db:5432/prospex
      JOB_MODE: worker
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    command: node apps/api/dist/worker.js
    env_file: .env
    environment:
      DATABASE_URL: postgres://prospex:prospex@db:5432/prospex
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
