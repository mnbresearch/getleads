services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: getleads
      POSTGRES_PASSWORD: getleads
      POSTGRES_DB: getleads
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U getleads"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    command: node apps/api/dist/server.js
    env_file: .env
    environment:
      DATABASE_URL: postgres://getleads:getleads@db:5432/getleads
      JOB_MODE: worker
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    command: node apps/api/dist/worker.js
    env_file: .env
    environment:
      DATABASE_URL: postgres://getleads:getleads@db:5432/getleads
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
