# Render Blueprint - free tier. One web service runs API + embedded worker.
# Database: Neon (recommended, free compute suspends but never loses data) or Supabase (free,
# but the whole project pauses after 7 days idle). Paste the pooled connection string as DATABASE_URL.
# This blueprint is set for the PRODUCTION path: PILOT_MODE=false + DEFAULT_PLAN=free, so new
# signups land on the free plan and Stripe "Upgrade" buttons are live on paid tiers (Starter/
# Growth/Scale/Enterprise) the moment STRIPE_* vars are filled in - no prepaid data-provider keys
# required to open paid signups. Set PILOT_MODE back to "true" instead if you want the old
# everything-free pilot behavior with no billing.
services:
  - type: web
    name: prospex-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build -w packages/core -w packages/db -w packages/sdk -w apps/api
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JOB_MODE
        value: worker
      - key: EMBED_WORKER
        value: "true"
      - key: WORKER_CONCURRENCY
        value: "2"
      - key: SMTP_PROBE_ENABLED
        value: "false"     # Render blocks outbound port 25
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      # JWT_SECRET signs every session: keep it at 32+ random characters. ENCRYPTION_KEY
      # encrypts stored SMTP/CRM credentials: when rotating it, add ENCRYPTION_KEYS_OLD with
      # the previous value or those credentials become unreadable.
      #
      # INTERNAL_TOKEN is the job runner's token (/internal/jobs/run, header x-internal-token).
      # This service runs an embedded worker and never calls that endpoint; the token is NOT
      # an admin credential. If it was ever used in a URL, rotate it here in the dashboard.
      - key: INTERNAL_TOKEN
        generateValue: true
      # Server-to-server access to /v1/admin (header x-admin-token). Its own credential,
      # separate from INTERNAL_TOKEN. The admin dashboard does not use it: that signs in with
      # ADMIN_EMAIL / ADMIN_PASSWORD (set those in the dashboard).
      - key: ADMIN_API_TOKEN
        generateValue: true
      # Optional, all with safe defaults (set them in the dashboard when needed; see DEPLOY.md B8):
      #   ADMIN_JWT_SECRET          signs the admin session with its own key (default: JWT_SECRET)
      #   ENCRYPTION_KEYS_OLD       previous ENCRYPTION_KEY values, needed when rotating that key
      #   LEAD_NOTIFY_EMAIL         where upgrade requests are emailed (default: ADMIN_EMAIL)
      #   OUTBOUND_SENDING_ENABLED  "false" pauses every campaign send platform-wide
      #   ORG_DAILY_SEND_CEILING    most one workspace may send per day (default 2000)
      #   SYSTEM_SENDER_DAILY_CAP   most one workspace may send per day through the shared sender
      #   CORS_EXTRA_ORIGINS        extra browser origins allowed to call the API
      # Render's edge is Cloudflare, which sets cf-connecting-ip itself. Rate limits and the
      # security log read the visitor's address from it. Use "xff" on a host that is not
      # behind Cloudflare.
      - key: TRUSTED_PROXY
        value: cloudflare
      - key: APP_URL
        sync: false
      - key: API_URL
        sync: false
      # AI - both free, second one is automatic fallback if the first is rate-limited
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Search. Serper is the primary provider: Google closed Custom Search to new customers
      # in Sep 2026, so GOOGLE_CSE_API_KEY only works for projects that already had access.
      # Brave has had no free tier since Feb 2026 and is left unset on purpose.
      - key: SERPER_API_KEY
        sync: false
      - key: GOOGLE_CSE_API_KEY
        sync: false
      - key: GOOGLE_CSE_CX
        sync: false
      # Sign in with Google (optional). The redirect URI registered in the Google console
      # must be exactly <API_URL>/v1/auth/google/callback.
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      # Email
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      # Optional verification boost (free tier)
      - key: HUNTER_API_KEY
        sync: false
      # Pay-as-you-go email verification, credits never expire. Tried before Hunter so
      # Hunter credits are spent on finding addresses, not checking them. One is enough.
      - key: REOON_API_KEY
        sync: false
      - key: MILLIONVERIFIER_API_KEY
        sync: false
      # Metered web search with a monthly free credit; replaces Google CSE, which is closed
      # to new customers and ends on 1 Jan 2027.
      - key: BRAVE_SEARCH_API_KEY
        sync: false
      # Production path: paid plans open, no pre-purchased data-provider credits needed to start
      - key: PILOT_MODE
        value: "false"
      - key: DEFAULT_PLAN
        value: "free"
      # Billing - required for the production path; leave unset to keep billing off (upgrade
      # buttons simply won't render) until Stripe is ready
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_STARTER
        sync: false
      - key: STRIPE_PRICE_GROWTH
        sync: false
      - key: STRIPE_PRICE_SCALE
        sync: false
      - key: STRIPE_PRICE_ENTERPRISE
        sync: false
