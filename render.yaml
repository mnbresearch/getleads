# Render Blueprint - free tier. One web service runs API + embedded worker.
# Database: Neon (recommended, free compute suspends but never loses data) or Supabase (free,
# but the whole project pauses after 7 days idle). Paste the pooled connection string as DATABASE_URL.
# This blueprint is set for the PRODUCTION path: PILOT_MODE=false + DEFAULT_PLAN=free, so new
# signups land on the free plan and Stripe "Upgrade" buttons are live on paid tiers (Starter/
# Growth/Scale/Enterprise) the moment STRIPE_* vars are filled in - no prepaid data-provider keys
# required to open paid signups. Set PILOT_MODE back to "true" instead if you want the old
# everything-free pilot behavior with no billing.
#
# Node: the version comes from "engines" in package.json (22.x). The server refuses to start
# in production only for two things: JWT_SECRET or ENCRYPTION_KEY that is a published example
# value or shorter than 16 characters. Both are generated below, so a Blueprint deploy never
# trips that. Keys marked `sync: false` are asked for once, when the Blueprint is first
# created; adding one to this file later does not touch a service that already exists.
services:
  - type: web
    name: prospex-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build -w packages/core -w packages/db -w packages/sdk -w apps/api
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JOB_MODE
        value: worker
      - key: EMBED_WORKER
        value: "true"
      - key: WORKER_CONCURRENCY
        value: "2"
      - key: SMTP_PROBE_ENABLED
        value: "false"     # Render blocks outbound port 25
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      # JWT_SECRET signs every session: keep it at 32+ random characters. ENCRYPTION_KEY
      # encrypts stored SMTP/CRM credentials: when rotating it, add ENCRYPTION_KEYS_OLD with
      # the previous value or those credentials become unreadable.
      #
      # INTERNAL_TOKEN is the job runner's token (/internal/jobs/run, header x-internal-token).
      # This service runs an embedded worker and never calls that endpoint; the token is NOT
      # an admin credential. If it was ever used in a URL, rotate it here in the dashboard.
      - key: INTERNAL_TOKEN
        generateValue: true
      # Server-to-server access to /v1/admin (header x-admin-token). Its own credential,
      # separate from INTERNAL_TOKEN. The admin dashboard does not use it: that signs in with
      # ADMIN_EMAIL / ADMIN_PASSWORD (set those in the dashboard).
      - key: ADMIN_API_TOKEN
        generateValue: true
      # Optional second factor for the admin dashboard login. Leave it empty to keep the
      # login as email + password. To turn it on: create a base32 secret
      # (`openssl rand 20 | base32`), add it to an authenticator app as a time-based account,
      # keep a copy in your password manager, and paste it here. The /admin login then asks
      # for the 6-digit code after the password. Steps and recovery: DEPLOY.md section B9.
      - key: ADMIN_TOTP_SECRET
        sync: false
      # The admin dashboard login (/admin). Without both, the admin login answers "not
      # configured". Use a long random password; a short or well-known one is refused.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Optional: sign the admin session with its own key (default: JWT_SECRET).
      - key: ADMIN_JWT_SECRET
        sync: false
      # Previous ENCRYPTION_KEY values (comma-separated, newest first). Needed only while
      # rotating that key, so credentials saved under the old one stay readable.
      - key: ENCRYPTION_KEYS_OLD
        sync: false
      # Where upgrade requests are emailed (default: ADMIN_EMAIL).
      - key: LEAD_NOTIFY_EMAIL
        sync: false
      # Extra browser origins allowed to call the API, comma-separated (APP_URL always is).
      - key: CORS_EXTRA_ORIGINS
        sync: false
      # If set, signing up needs this code.
      - key: PILOT_INVITE_CODE
        sync: false
      # Optional settings with safe defaults. They are NOT declared as keys on purpose: an
      # empty value would replace the default. Add one in the dashboard only when needed
      # (DEPLOY.md B8):
      #   DATABASE_SSL              disable | require | verify-full. Unset, the server decides
      #                             from the database host: a Neon host has its certificate
      #                             checked; any other remote host must use TLS. See DEPLOY.md
      #                             "Database connection security" before changing it.
      #   DATABASE_SSL_CA           PEM text (or a file path) of the CA to check the database
      #                             certificate against, for providers that use their own CA.
      #   MIGRATION_DATABASE_URL    a separate, schema-owning connection used only for
      #                             migrations (default: DATABASE_URL)
      #   AUTO_MIGRATE              "false" stops the API applying migrations on boot
      #   DB_POOL_MAX               database connections per process (default 10)
      #   OUTBOUND_SENDING_ENABLED  "false" pauses every campaign send platform-wide
      #   ORG_DAILY_SEND_CEILING    most one workspace may send per day (default 2000)
      #   SYSTEM_SENDER_DAILY_CAP   most one workspace may send per day through the shared sender
      #   SMTP_PORT / SMTP_SECURE   with SMTP_HOST below (defaults 587 / false)
      #   SMTP_ALLOWED_PORTS        extra SMTP ports customers may use
      #   CORS_ALLOW_REGEX          pattern of further allowed browser origins; unset allows
      #                             https://*.vercel.app previews, "none" allows only the
      #                             exact origins
      #   AI_PROVIDER, OPENAI_COMPAT_BASE_URL / _API_KEY / _MODEL   another AI endpoint
      #   CREDENTIAL_REBIND_ON_READ    "true" rewrites old-format saved credentials in the new
      #                                format when read. Default off (cheap rollback, DEPLOY.md B11)
      #   LINK_TOKENS_CLEAR_PLAINTEXT  "true" removes the readable copy of existing client report
      #                                links. Default off (cheap rollback, DEPLOY.md B11)
      #   PRIVACY_SWEEP                "off" skips removing content of leads deleted before this
      #                                release. Default on; it cannot be rolled back
      #   IP_LOOKUP_ALLOW_PLAIN_HTTP   "true" re-enables the plain-HTTP visitor look-up provider
      #                                as a last resort. Default off; prefer IPINFO_TOKEN
      #   PASSWORD_HASH_CONCURRENCY password checks at once, each on a worker thread (default 2)
      #   LIST_QUERY_TIMEOUT_MS     longest one list or search read may run (250-60000, default 8000)
      #   ROW_CAP_<KIND>            most of one kind of thing per workspace (DEPLOY.md B11)
      #   JOB_OPEN_TYPE_CAP / JOB_OPEN_TOTAL_CAP   most queued jobs per workspace (10000 / 20000)
      #   DEBUG_SEARCH              "true" puts customers' search text in the log; debugging only
      #   SHUTDOWN_GRACE_MS         how long requests and jobs get to finish on a restart
      #                             (default 25000; Render stops the process after 30 s)
      #   HTTP_KEEPALIVE_TIMEOUT_MS / HTTP_REQUEST_TIMEOUT_MS / HTTP_HEADERS_TIMEOUT_MS
      #                             server timeouts (defaults 75000 / 120000 / 30000)
      # Render's edge is Cloudflare, which sets cf-connecting-ip itself. Rate limits and the
      # security log read the visitor's address from it. Use "xff" on a host that is not
      # behind Cloudflare.
      - key: TRUSTED_PROXY
        value: cloudflare
      - key: APP_URL
        sync: false
      - key: API_URL
        sync: false
      # AI - both free, second one is automatic fallback if the first is rate-limited
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Search. Serper is the primary provider: Google closed Custom Search to new customers
      # in Sep 2026, so GOOGLE_CSE_API_KEY only works for projects that already had access.
      # Brave has had no free tier since Feb 2026 and is left unset on purpose.
      - key: SERPER_API_KEY
        sync: false
      - key: GOOGLE_CSE_API_KEY
        sync: false
      - key: GOOGLE_CSE_CX
        sync: false
      # Sign in with Google (optional). The redirect URI registered in the Google console
      # must be exactly <API_URL>/v1/auth/google/callback.
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      # Email
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      # Signing secret of the Resend webhook (Resend dashboard -> Webhooks). Without it,
      # delivery events are refused, so bounces and spam complaints never reach the
      # suppression list. Point the webhook at <API_URL>/v1/email-events/resend.
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      # Platform mail through SMTP instead of Resend (optional; SMTP_PORT defaults to 587).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      # Optional verification boost (free tier)
      - key: HUNTER_API_KEY
        sync: false
      # Pay-as-you-go email verification, credits never expire. Tried before Hunter so
      # Hunter credits are spent on finding addresses, not checking them. One is enough.
      - key: REOON_API_KEY
        sync: false
      - key: MILLIONVERIFIER_API_KEY
        sync: false
      # Metered web search with a monthly free credit; replaces Google CSE, which is closed
      # to new customers and ends on 1 Jan 2027.
      - key: BRAVE_SEARCH_API_KEY
        sync: false
      # Optional data and AI providers (each is simply off when unset)
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APOLLO_API_KEY
        sync: false
      - key: PDL_API_KEY
        sync: false
      - key: SERPAPI_KEY
        sync: false
      - key: ABSTRACT_EMAIL_API_KEY
        sync: false
      - key: IPINFO_TOKEN
        sync: false
      # Production path: paid plans open, no pre-purchased data-provider credits needed to start
      - key: PILOT_MODE
        value: "false"
      - key: DEFAULT_PLAN
        value: "free"
      # Billing - required for the production path; leave unset to keep billing off (upgrade
      # buttons simply won't render) until Stripe is ready
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_STARTER
        sync: false
      - key: STRIPE_PRICE_GROWTH
        sync: false
      - key: STRIPE_PRICE_SCALE
        sync: false
      - key: STRIPE_PRICE_ENTERPRISE
        sync: false
